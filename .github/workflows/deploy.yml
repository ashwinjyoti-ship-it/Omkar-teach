name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/improve-ui/ux-professionalism"
      - main
    paths:
      - "akshay-todo/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: akshay-todo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: akshay-todo

      - name: Build
        run: npm run build
        working-directory: akshay-todo

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=akshay-todo
          workingDirectory: akshay-todo
